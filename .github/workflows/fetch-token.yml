name: 时光徽章价格定时抓取

on:
  # 每 15 分钟触发一次。GitHub 的 schedule 在低活跃仓库上常被延迟
  # (实测中位数约 3.5 小时), 因此补缺密度主要靠"单次运行内多次采样 +
  # concurrency 串行"来兜底: 一次运行长达约 5 小时, 期间一直有排队运行,
  # 上一轮结束后排队的运行会立刻接上, 不依赖 cron 准点触发。
  schedule:
    - cron: '*/15 * * * *'
  # 允许手动触发测试
  workflow_dispatch:

# 同一时间只保留一个运行: 新触发的运行排队等待(自动替换更早的排队运行),
# 不打断正在进行的多采样运行, 从而把相邻运行的 20 分钟桶首尾接起来。
concurrency:
  group: token-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 16 次采样 × 20 分钟 = 300 分钟采样跨度; 350 分钟给 checkout/setup/
    # 每轮提交/网络重试留约 50 分钟余量, 不把超时压到刚好盖住采样总时长。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 + 每轮提交(一次运行内多次采样)
        id: fetch
        # 采样失败也继续, 已采到的数据在采样循环内就已逐轮提交;
        # 最后由"标记抓取失败"步骤把整次运行显式标红。
        continue-on-error: true
        env:
          SAMPLES: '16'
          INTERVAL_SECONDS: '1200'
          # 让脚本在每轮采样后自行 commit + push(失败会留在本地并在下轮重试)
          AUTO_COMMIT: '1'
        run: node .github/scripts/fetch-token.js

      - name: 兜底检查(脚本异常退出时的残留)
        # 只诊断, 不提交、不推送。
        # 提交/推送完全由脚本负责(fetch → reset --hard → 重新合并 → commit → push);
        # 这里若也用 commit + rebase, 会和其它 run 的同一个生成文件产生文本冲突,
        # 正是之前 16/16 推送全部失败的原因。残留数据由下一轮重新抓取覆盖。
        if: always()
        run: |
          git add token-data/hourly.json token-data/daily.json
          if git diff --cached --quiet; then
            echo "无残留未提交数据"
          else
            git diff --cached --stat
            echo "::warning::存在未提交的数据(脚本异常退出), 本轮不上传, 下一轮重新抓取"
          fi
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "未推送的本地提交: $(git rev-list --count origin/main..HEAD)"
          fi

      - name: 标记抓取失败
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "抓取步骤存在失败(见上方日志), 本次运行标记为失败"
          exit 1
