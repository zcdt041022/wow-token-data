name: 时光徽章价格定时抓取

on:
  # 每 15 分钟触发一次。GitHub 的 schedule 在低活跃仓库上常被延迟
  # (实测中位数约 3.5 小时), 因此补缺密度主要靠"单次运行内多次采样 +
  # concurrency 串行"来兜底: 一次运行长达约 5 小时, 期间一直有排队运行,
  # 上一轮结束后排队的运行会立刻接上, 不依赖 cron 准点触发。
  schedule:
    - cron: '*/15 * * * *'
  # 允许手动触发测试
  workflow_dispatch:

# 同一时间只保留一个运行: 新触发的运行排队等待(自动替换更早的排队运行),
# 不打断正在进行的多采样运行, 从而把相邻运行的 20 分钟桶首尾接起来。
concurrency:
  group: token-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 16 次采样 × 20 分钟 = 300 分钟采样跨度; 350 分钟给 checkout/setup/
    # 每轮提交/网络重试留约 50 分钟余量, 不把超时压到刚好盖住采样总时长。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 + 每轮提交(一次运行内多次采样)
        id: fetch
        # 采样失败也继续, 已采到的数据在采样循环内就已逐轮提交;
        # 最后由"标记抓取失败"步骤把整次运行显式标红。
        continue-on-error: true
        env:
          SAMPLES: '16'
          INTERVAL_SECONDS: '1200'
          # 让脚本在每轮采样后自行 commit + push(失败会留在本地并在下轮重试)
          AUTO_COMMIT: '1'
        run: node .github/scripts/fetch-token.js

      - name: 兜底提交(脚本提前退出时的剩余数据)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add token-data/hourly.json token-data/daily.json
          if git diff --cached --quiet; then
            echo "没有待提交数据(正常情况下已由采样循环逐轮提交)"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "auto: token fallback $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # 并发写入冲突时如实失败, 不用 exit 0 把错误伪装成成功
          git fetch origin main
          git rebase origin/main || { git rebase --abort; echo "rebase 失败"; exit 1; }
          git push origin HEAD:main

      - name: 标记抓取失败
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "抓取步骤存在失败(见上方日志), 本次运行标记为失败"
          exit 1
